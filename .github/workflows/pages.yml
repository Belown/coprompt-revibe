# The offline demo on GitHub Pages (https://belown.github.io/coprompt-revibe/demo/), independent of our own server.
# Pages has no backend, so the app always runs as the demo there (config.js): local mode, Titanic only, scripted model.
# Needs Settings → Pages → Source: GitHub Actions.
name: Pages backup
on:
  push:
    branches: [main]
    paths: [frontend/**, scripts/fetch-pyodide.mjs, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node ../scripts/fetch-pyodide.mjs   # the demo's own Pyodide: no CDN needed when it runs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v5
