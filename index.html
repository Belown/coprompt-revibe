<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoPrompt Revibe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#f6f5f1; --surface:#fff; --sunken:#f3f2ee; --sidebar:#fbfaf7; --hover:#efede8;
  --ink:#1c1c1f; --ink-2:#44454c; --mut:#64656c; --faint:#74757c;
  --line:#e6e3dc; --line-2:#d6d2c8;
  --accent:#2f5bd3; --accent-soft:#e9eefb; --accent-line:#bccbf1;
  --alice:#c33a66; --bob:#2d62c4;
  --refer:#a85b08; --request:#0a74a5; --share:#b2357f; --link:#6b4fd6;
  --ok:#1f7a4d; --ok-soft:#e5f3ea; --warn:#9a5700; --warn-soft:#fbf0dc; --err:#b42318; --err-soft:#fdeceb;
  --r-sm:7px; --r:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(28,28,31,.05),0 1px 1px rgba(28,28,31,.03);
  --sh-2:0 6px 16px -6px rgba(28,28,31,.18),0 2px 4px rgba(28,28,31,.06);
  --sh-3:0 24px 56px -16px rgba(28,28,31,.32),0 6px 14px rgba(28,28,31,.08);
  --ease:cubic-bezier(.16,1,.3,1);
  --font:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.5 var(--font);color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
::selection{background:#cad6f7;color:var(--ink)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
[contenteditable],textarea,input{caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.grow{flex:1}.muted{color:var(--mut)}

/* ---------- controls ---------- */
button{font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 12px;
  font-size:14px;font-weight:500;line-height:1.2;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
button:hover{background:var(--sunken);border-color:var(--line-2)}
button:active{transform:translateY(.5px)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--ink);border-color:var(--ink);color:#fff}
button.primary:hover{background:#36363d;border-color:#36363d}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;min-height:62px;padding:10px 28px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin:0 8px 0 0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand small{font-size:13px;font-weight:500;letter-spacing:0;color:var(--mut)}
#me{display:inline-flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500}
#pystat{display:inline-flex;align-items:center;gap:8px;margin-right:6px;font-size:13.5px;color:var(--mut)}
#pystat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
#pystat[data-s=ok]::before{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
#pystat[data-s=err]{color:var(--err)}
#pystat[data-s=err]::before{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:28px;padding:28px 28px 72px;align-items:start;max-width:1720px;margin:0 auto}
#editor{display:flex;flex-direction:column;gap:12px;min-width:0;width:100%;max-width:980px;justify-self:center}
aside{position:sticky;top:90px;display:flex;flex-direction:column;height:calc(100vh - 114px);min-height:420px;
  background:var(--sidebar);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.pane{display:flex;flex-direction:column;min-height:0}
#wikiCard{flex:3 1 0}
#msgCard{flex:2 1 0;border-top:1px solid var(--line)}
.pane-h{display:flex;align-items:center;gap:8px;padding:14px 18px 8px;margin:0;font-size:15px;font-weight:600}
.pane-h .ic{color:var(--mut)}
.pane-b{flex:1;min-height:0;overflow:auto;padding:0 10px 12px}
#msgCount{margin-left:auto;font-size:12px;font-weight:600;color:#fff;background:var(--err);border-radius:999px;padding:2px 9px}
#msgCount:empty{display:none}

/* ---------- blocks ---------- */
.block{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh-1);
  transition:border-color .2s,box-shadow .2s}
.pb:hover{border-color:var(--line-2)}
.pb:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-1)}
.block.here{border-color:var(--who);box-shadow:0 0 0 1px var(--who),var(--sh-1)}
.block.flash{animation:ripple 1.5s var(--ease)}
@keyframes ripple{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc,var(--accent)) 60%,transparent),var(--sh-1);border-color:var(--pc,var(--accent))}
  30%{box-shadow:0 0 0 7px color-mix(in srgb,var(--pc,var(--accent)) 22%,transparent),var(--sh-1);border-color:var(--pc,var(--accent))}
  100%{box-shadow:0 0 0 14px transparent,var(--sh-1)}}

/* headings */
.hb{background:none;border:none;box-shadow:none;padding:20px 0 0;display:flex;align-items:center;gap:10px}
.hb[data-l="1"]{padding-top:4px}
.htext{flex:1;outline:none;font-weight:700;letter-spacing:-.015em;border-radius:8px;padding:2px 8px;margin-left:-8px;text-wrap:balance}
.htext:hover{background:var(--hover)}
.htext:focus{background:var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.hb[data-l="1"] .htext{font-size:30px;line-height:1.2;letter-spacing:-.025em}
.hb[data-l="2"] .htext{font-size:22px;line-height:1.25}
.hb[data-l="3"] .htext{font-size:17px;line-height:1.35;font-weight:600;letter-spacing:-.005em}
.lvl{flex:none;min-width:30px;padding:4px 5px;font:600 11px/1 var(--mono);text-align:center;color:var(--mut);cursor:pointer;
  border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.lvl:hover{color:var(--ink);border-color:var(--line-2)}

/* prompt blocks */
.phead{display:flex;align-items:center;gap:10px}
.prompt{flex:1;min-width:0;outline:none;font-size:17px;font-weight:500;line-height:1.5;padding:5px 9px;border-radius:8px;min-height:38px;transition:background .15s}
.prompt:hover,.prompt:focus{background:var(--sunken)}
.prompt:empty::before{content:attr(data-ph);color:var(--faint);font-weight:400}
.av{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center;flex:none;box-shadow:0 0 0 2px var(--surface)}
.tools{display:flex;gap:2px}
.tools button,.ctl button,.phdr button{border-color:transparent;background:transparent;color:var(--mut);padding:7px}
.tools button:hover,.ctl button:hover,.phdr button:hover{background:var(--sunken);color:var(--ink);border-color:transparent}
.tools .ic{width:18px;height:18px}
.ctl{display:inline-flex;gap:2px;opacity:0;transition:opacity .15s}
.block:hover .ctl,.block:focus-within .ctl{opacity:1}
.ctl button{font-size:13px;padding:6px 9px}
.busy:not(:empty){display:inline-flex;align-items:center;gap:8px;margin:8px 0 0 36px;padding:5px 12px 5px 10px;font-size:13.5px;font-weight:500;
  color:var(--warn);background:var(--warn-soft);border-radius:999px;animation:rise .2s var(--ease)}
.busy .ic{animation:spin .9s linear infinite}
.presence:not(:empty){position:absolute;top:-12px;right:16px;z-index:1;display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 8px;
  font-size:12.5px;font-weight:600;color:#fff;border-radius:999px;box-shadow:var(--sh-1)}
.presence .ic{width:13px;height:13px}
textarea.code{display:block;width:100%;margin-top:10px;font:400 14px/1.6 var(--mono);font-variant-ligatures:none;color:var(--ink);
  background:var(--sunken);border:1px solid var(--line);border-radius:9px;padding:10px 13px;resize:vertical;tab-size:4;transition:background .15s,border-color .15s,box-shadow .15s}
textarea.code:focus{outline:none;background:var(--surface);border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.code::placeholder{color:var(--faint)}
.runbar{display:flex;align-items:center;gap:8px;margin-top:10px}
kbd{font:500 11px/1 var(--mono);padding:3px 5px;border:1px solid currentColor;border-radius:5px;opacity:.55}
button.gen{padding:7px 10px 7px 11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
button.gen:hover{background:#dfe7fa;border-color:var(--accent)}
button.gen kbd{margin-left:2px}
#settings.needs{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,white)}
button.run{padding:7px 14px 7px 11px;font-weight:600}
button.run .ic{width:13px;height:13px;fill:currentColor}
.out{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2);font:13.5px/1.55 var(--mono);font-variant-numeric:tabular-nums;
  white-space:pre;color:var(--ink-2);max-height:340px;overflow:auto}
.out:empty{display:none}
.out .err{display:block;white-space:pre-wrap;padding:9px 12px;border-radius:8px;color:var(--err);background:var(--err-soft)}
.out img{display:block;max-width:100%;margin-top:4px;border:1px solid var(--line);border-radius:9px;background:#fff}
.dots{display:inline-flex;align-items:center;gap:4px}
.dots:empty{display:none}
.dots i,.nd i{width:8px;height:8px;border-radius:50%;display:inline-block}
#addbar{display:flex;gap:8px;padding-top:6px}
#addbar button{background:transparent;border-style:dashed;color:var(--mut)}
#addbar button:hover{background:var(--surface);border-style:solid;color:var(--ink)}

/* nodes */
.node{display:inline-flex;align-items:center;gap:5px;margin:0 2px;padding:0 7px;vertical-align:baseline;cursor:pointer;
  font:500 .9em/1.55 var(--mono);color:#1f2f63;background:var(--accent-soft);border:1.5px solid var(--accent-line);border-radius:7px;transition:box-shadow .15s}
.node:hover{box-shadow:0 0 0 3px var(--accent-soft)}
.node.src{outline:2px dashed var(--ink);outline-offset:2px}
.node.tsel{outline:2px solid var(--ink);outline-offset:2px}
.nd{display:inline-flex;gap:3px}.nd:empty{display:none}

/* explanation + history */
.panel:not(:empty){margin-top:12px;padding:12px 14px;background:#fcfbf9;border:1px solid var(--line);border-radius:10px;animation:rise .2s var(--ease)}
.phdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14.5px;font-weight:600}
.phdr button{padding:5px}
.xprompt{margin-bottom:10px;font-size:16px;line-height:1.65}
.xprompt mark,.xsteps mark{color:inherit;border-radius:4px;padding:1px 3px;transition:opacity .15s}
.xcode,.dcode{margin:0 0 10px;padding:6px 0;overflow:auto;font:13px/1.6 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.xcode div,.dcode div{padding:0 12px;white-space:pre;transition:opacity .15s}
.dim{opacity:.22}
.xsteps{display:grid;gap:6px;margin:0;padding-left:22px;font-size:14.5px;color:var(--ink-2)}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:14px}
.hrow:hover{background:var(--hover)}
.hrow.on{background:var(--accent-soft)}
.hrow .av{width:22px;height:22px;font-size:11px}
.hrow b{font-weight:600}
.hint{font-size:13px;color:var(--mut);margin:10px 0 6px}
.panel > .err{padding:9px 12px;border-radius:8px;color:var(--err);background:var(--err-soft)}
.del{background:#fde4e2;color:#8a1c12;text-decoration:line-through;text-decoration-color:rgba(138,28,18,.45)}
.ins{background:#ddf2e5;color:#14532d}

/* wiki */
#srcbar:not(:empty){display:flex;align-items:center;gap:10px;margin:0 2px 10px;padding:9px 8px 9px 12px;font-size:13.5px;line-height:1.4;
  color:#fff;background:var(--ink);border-radius:10px;animation:rise .2s var(--ease)}
#srcbar code{font:600 13px var(--mono);background:rgba(255,255,255,.14);border-radius:5px;padding:1px 6px}
#srcbar button{margin-left:auto;padding:5px;color:#fff;background:transparent;border-color:transparent}
#srcbar button:hover{background:rgba(255,255,255,.16)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 8px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--c);cursor:help}
.lg .ic{width:14px;height:14px}
.howto{margin:6px 8px 10px;font-size:13px;line-height:1.45;color:var(--mut)}
.pane-b:has(#wiki.picking) .howto{display:none}
.wrow.is-src{background:var(--sunken)}
.srctag{margin-left:auto;padding:1px 9px;font-size:12px;font-weight:600;color:var(--mut);border:1px dashed var(--line-2);border-radius:999px}
.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:34px;padding:5px 8px;border-radius:8px;font-size:15px;line-height:1.4;transition:background .12s}
.wrow:hover{background:var(--hover)}
#wiki.picking .wrow:hover{background:var(--accent-soft)}
.wh{font-weight:600}
.wp{color:var(--ink-2)}
.wh .hl{width:20px;font:600 10.5px/1 var(--mono);color:var(--mut)}
.wrow .av{width:22px;height:22px;font-size:11px}
.fold{display:inline-grid;place-items:center;width:20px;height:20px;color:var(--mut);cursor:pointer;border-radius:5px}
.fold:hover{background:var(--line);color:var(--ink)}
.wtext{flex:1;min-width:0;cursor:pointer}
.pills{display:none;flex-basis:100%;justify-content:flex-end;gap:6px;padding:2px 0}
#wiki.picking .pills{display:inline-flex}
.pill{gap:5px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:600;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,white);
  background:color-mix(in srgb,var(--c) 7%,white);border-radius:999px}
.pill:hover{color:#fff;background:var(--c);border-color:var(--c)}
.pill .ic{width:14px;height:14px}

/* messages */
.msg{padding:10px;border-radius:10px;font-size:14px;cursor:pointer;transition:background .12s}
.msg + .msg{margin-top:2px}
.msg:hover{background:var(--hover)}
.msg.new{background:var(--surface);box-shadow:0 0 0 1px var(--line),var(--sh-1)}
.mtop{display:flex;align-items:center;gap:8px}
.udot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--err)}
.mtype{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.mstat{padding:1px 8px;font-size:12px;font-weight:600;color:var(--mut);background:var(--sunken);border-radius:999px}
.mstat[data-s=open]{color:var(--warn);background:var(--warn-soft)}
.mstat[data-s=fulfilled],.mstat[data-s=accepted],.mstat[data-s=done],.mstat[data-s=active]{color:var(--ok);background:var(--ok-soft)}
.mtime{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.msg button{padding:3px 9px;font-size:12.5px}
.mline{display:grid;grid-template-columns:40px 20px 1fr;align-items:start;gap:8px;margin-top:6px;line-height:1.45}
.mline .lbl{padding-top:1px;font-size:12px;font-weight:600;color:var(--mut)}
.mline .av{width:20px;height:20px;font-size:10px;margin-top:1px}
.mline .jump{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;cursor:pointer}
.mline .jump:hover{text-decoration-color:var(--ink)}
.mmsg{margin:8px 0 0 48px;padding:7px 11px;font-size:13.5px;color:var(--ink-2);background:var(--sunken);border-radius:8px}
.empty{padding:6px 8px;font-size:14px;line-height:1.55;color:var(--mut)}

/* floating + overlays */
#mk{position:absolute;z-index:20;gap:6px;padding:6px 13px 6px 10px;font-size:13.5px;font-weight:600;color:#fff;background:var(--ink);border:none;border-radius:999px;box-shadow:var(--sh-2);animation:pop .16s var(--ease)}
#mk:hover{background:#36363d}
#mk[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(24,24,28,.4);animation:fade .15s ease-out}
#modal[hidden]{display:none}
.dlg{display:flex;flex-direction:column;gap:14px;width:min(500px,100%);padding:22px 22px 18px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-3);animation:rise .22s var(--ease)}
.dlg h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.dlg p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-2)}
.dlg p.muted{font-size:13.5px;color:var(--mut)}
.dlg label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.dlg input{font:inherit;font-size:15px;padding:9px 12px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px}
.dlg input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
#toast{position:fixed;bottom:24px;left:50%;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100vw - 32px);transform:translateX(-50%);pointer-events:none}
#toast div.act{pointer-events:auto}
#toast div.err{background:var(--err)}
#toast button{margin-left:6px;padding:4px 11px;font-size:13.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.14);border-color:transparent}
#toast button:hover{background:rgba(255,255,255,.26);border-color:transparent}
#toast div{display:flex;align-items:center;gap:10px;max-width:640px;padding:11px 16px;font-size:14.5px;line-height:1.45;color:#fff;background:var(--ink);border-radius:12px;box-shadow:var(--sh-3);animation:rise .22s var(--ease)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- smaller screens ---------- */
@media (max-width:1180px){main{grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:20px 20px 64px}}
@media (max-width:880px){
  header{flex-wrap:wrap;padding:10px 16px;gap:8px}
  .brand small{display:none}
  main{grid-template-columns:1fr;padding:16px 16px 56px}
  aside{position:static;height:auto;min-height:0}
  .pane{flex:none}
  .pane-b{max-height:60vh}
  .hb .ctl{display:none}
  .hb:focus-within .ctl{display:inline-flex}
  .hb[data-l="1"] .htext{font-size:25px}
  .busy:not(:empty){margin-left:0}
  .ctl{opacity:1}
  .runbar{flex-wrap:wrap}
  .gen kbd{display:none}
}
</style>
</head>
<body>
<header>
  <h1 class="brand">CoPrompt <small>revibe · CHI ’24</small></h1>
  <span id="me"></span>
  <span class="grow"></span>
  <span id="pystat" data-s="load">Python: loading…</span>
  <button id="other" data-icon="external"></button>
  <button id="settings" data-icon="key">API key</button>
  <button id="reset" data-icon="reset">Reset demo</button>
</header>
<main>
  <section id="editor">
    <div id="addbar"><button data-k="p" data-icon="plus">Prompt block</button><button data-k="h" data-icon="plus">Heading</button></div>
  </section>
  <aside>
    <section class="pane" id="wikiCard"><h2 class="pane-h" data-icon="tree">Prompt Wiki</h2><div class="pane-b"><div id="legend"></div><div id="srcbar"></div><div id="wiki"></div></div></section>
    <section class="pane" id="msgCard"><h2 class="pane-h" data-icon="inbox">Messages <span id="msgCount"></span></h2><div class="pane-b"><div id="msgs"></div></div></section>
  </aside>
</main>
<button id="mk" data-icon="node" hidden>Make node</button>

<script>
// ---------- basics ----------
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  e.append(...kids.flat().filter(k => k != null && k !== false));
  return e;
}
const ICONS = { // one stroked family (Lucide geometry), 24×24
  play: '<path d="M6 4.5v15l13-7.5z"/>',
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  history: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  down: '<path d="m6 9 6 6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
  reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  refer: '<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
  request: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
  share: '<path d="m18 9-6-6-6 6"/><path d="M12 3v14"/><path d="M5 21h14"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  node: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>',
  pencil: '<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
  loader: '<path d="M21 12a9 9 0 1 1-6.22-8.56"/>',
  tree: '<path d="M3 5h18"/><path d="M7 12h14"/><path d="M11 19h10"/><path d="M3 5v7a2 2 0 0 0 2 2h2"/><path d="M7 12v5a2 2 0 0 0 2 2h2"/>',
  sparkles: '<path d="M9.94 15.5a2 2 0 0 0-1.44-1.44l-6.13-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.13a.5.5 0 0 1 .96 0l1.58 6.13a2 2 0 0 0 1.44 1.44l6.13 1.58a.5.5 0 0 1 0 .96l-6.13 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0z"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
};
function icon(name) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'ic'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = ICONS[name]; return s;
}
const ME = new URLSearchParams(location.search).get('user') || 'Alice';
const UC = { Alice: 'var(--alice)', Bob: 'var(--bob)' };
const ucol = u => UC[u] || 'var(--ok)';
const av = (u, title) => h('span', { class: 'av', style: `background:${ucol(u)}`, title: title || u }, (u || '?')[0]);
const MECH = {
  refer:   { c: 'var(--refer)',   tip: 'Refer: rebuild MY source prompt from this prompt’s code + result' },
  request: { c: 'var(--request)', tip: 'Request: ask the owner to finish this; auto-update my prompt when done' },
  share:   { c: 'var(--share)',   tip: 'Share: push my source node into this prompt (owner must accept)' },
  link:    { c: 'var(--link)',    tip: 'Link: keep this node in sync with my source node' },
};
const mechTag = t => [icon(t), t]; // icon + name, used by pills and messages
function toast(m, { kind = 'info', ms = kind === 'err' ? 9000 : 4500, action } = {}) {
  const box = $('#toast'); while (box.children.length >= 3) box.firstChild.remove();
  const d = h('div', { role: kind === 'err' ? 'alert' : 'status', class: kind + (action ? ' act' : '') },
    kind === 'err' ? icon('alert') : null, h('span', {}, m),
    action ? h('button', { onclick: () => { action.fn(); d.remove(); } }, action.label) : null);
  box.append(d); setTimeout(() => d.remove(), ms);
}
const toastErr = m => toast(m, { kind: 'err' });
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };

// ---------- shared state (BroadcastChannel between windows + localStorage) ----------
// ponytail: same-browser sync only (two windows on one machine), no server/CRDT; per-object last-writer-wins.
const KEY = 'coprompt-state';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('Browser storage is full: changes still sync live but will not survive a reload. Use Reset demo.'); } };
let S = JSON.parse(localStorage.getItem(KEY) || 'null');
if (!S) { S = seed(); save(); } // persist now so a second window loads the same seed ids
const bc = new BroadcastChannel('coprompt');
const PRES = {}, BUSY = {};
let SOURCE = null, TGTNODE = null;
function put(kind, obj) {
  obj.upd = Date.now();
  S[kind][obj.id] = obj; save();
  bc.postMessage({ kind, obj });
  render();
}
bc.onmessage = ({ data: d }) => {
  if (d.kind === 'presence') { PRES[d.user] = d.b; return render(); }
  if (d.kind === 'busy') { d.label ? BUSY[d.id] = `${d.label} (${d.user})` : delete BUSY[d.id]; return render(); }
  if (d.kind === 'reset') return hardReset(d.S);
  const cur = S[d.kind][d.obj.id];
  if (cur && cur.upd > d.obj.upd) return;
  S[d.kind][d.obj.id] = d.obj; save(); render();
  if (d.kind === 'actions' && !cur && d.obj.owner === ME && d.obj.by !== ME)
    toast(`${d.obj.by} created a ${d.obj.type} on your prompt “${label(d.obj.tgt)}”`);
};
function busy(id, lab) {
  lab ? BUSY[id] = lab : delete BUSY[id];
  bc.postMessage({ kind: 'busy', id, label: lab, user: ME }); render();
}

function seed() {
  const S = { blocks: {}, actions: {} }; let pos = 0;
  const H = (text, level, author) => { const id = uid(); S.blocks[id] = { id, pos: pos += 1000, kind: 'h', level, text, author, upd: 0 }; };
  const P = (t, author, code) => {
    const id = uid(), segs = [{ t: 'text', v: t }];
    S.blocks[id] = { id, pos: pos += 1000, kind: 'p', segs, author, editor: author, code, out: null, upd: 0,
      hist: [{ ts: Date.now(), by: author, action: 'add prompt', segs, code }] };
  };
  H('Titanic Survival — Exploratory Data Analysis', 1, 'Alice');
  H('Data Preparation', 2, 'Alice');
  P('load data/titanic.csv into df', 'Alice', "import pandas as pd\ndf = pd.read_csv('data/titanic.csv')\ndf.head()");
  H('1. Deal with missing values in df', 3, 'Alice');
  H('2. Encode categorical features in df', 3, 'Alice');
  H('Feature Analysis', 2, 'Bob');
  H('3. Feature transformation', 3, 'Bob');
  H('4. Correlation analysis', 3, 'Bob');
  H('5. Deal with outliers', 3, 'Alice');
  return S;
}
function hardReset(newS) {
  S = newS; save(); SOURCE = TGTNODE = null;
  for (const id in els) { els[id].remove(); delete els[id]; }
  render();
}

// ---------- model helpers ----------
const ordered = () => Object.values(S.blocks).filter(b => !b.del).sort((a, b) => a.pos - b.pos);
const text = b => b.kind === 'h' ? b.text : b.segs.map(s => s.v).join('');
const label = ref => { const b = S.blocks[ref.b]; if (!b) return '?'; const s = ref.n && b.segs?.find(s => s.id === ref.n); return s ? s.v : text(b); };
const live = a => a.status !== 'unlinked' && !S.blocks[a.src.b]?.del && !S.blocks[a.tgt.b]?.del; // actions on deleted blocks go quiet
const actsOn = (b, n) => Object.values(S.actions).filter(a => live(a) &&
  ((a.src.b === b && (n === undefined || a.src.n === n)) || (a.tgt.b === b && (n === undefined || a.tgt.n === n))));
const snap = (b, action, by = ME) => ({ ts: Date.now(), by, action, segs: structuredClone(b.segs), code: b.code });
function ancestors(id) { // headings enclosing a block
  const st = [];
  for (const b of ordered()) {
    if (b.id === id) return st.map(x => x.id);
    if (b.kind === 'h') { while (st.length && st.at(-1).level >= b.level) st.pop(); st.push(b); }
  }
  return [];
}
function codeAbove(id) {
  const out = [];
  for (const b of ordered()) { if (b.id === id) break; if (b.kind === 'p' && b.code.trim()) out.push(`# [${b.author}] ${text(b)}\n${b.code}`); }
  return out.join('\n\n') || '(none)';
}
function outline() {
  return ordered().map(b => b.kind === 'h' ? `${'#'.repeat(b.level)} ${b.text} [${b.author}]` : `- prompt [${b.author}]: ${text(b)}`).join('\n');
}
function sharedCtx(id) { // context shared to an enclosing heading (share → heading)
  return ancestors(id).flatMap(hid => S.blocks[hid].ctx || []).map(pid => S.blocks[pid]).filter(Boolean)
    .map(p => `Shared by ${p.author} — prompt: ${text(p)}\n${p.code}`).join('\n\n');
}

// ---------- LLM (DeepSeek by default; a model name starting with "claude" uses Anthropic) ----------
const MODEL = () => localStorage.getItem('cp_model') || 'deepseek-flash';
async function llm(user, json) {
  const key = localStorage.getItem('cp_key');
  if (!key) { openSettings(); throw new Error('Set an API key first (⚙).'); }
  const system = `You are the code-generation engine of CoPrompt, a collaborative natural-language programming notebook.
Environment: Python 3 in the browser (Pyodide) with pandas, numpy, matplotlib, scipy and scikit-learn (seaborn may be available). The dataset is the Kaggle Titanic training set at 'data/titanic.csv'.
Before a block runs, all code blocks above it run top to bottom in the same namespace, so their variables can be used directly.
Never use Markdown code fences. ${json ? 'Reply with JSON only.' : 'Reply with raw Python code only.'}
Notebook outline (the prompt wiki; [Name] = author):
${outline()}`;
  let t;
  if (!MODEL().startsWith('claude')) { // DeepSeek, OpenAI-compatible chat completions
    const r = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { authorization: `Bearer ${key}`, 'content-type': 'application/json' },
      body: JSON.stringify({ model: MODEL(), max_tokens: 8000, thinking: { type: 'disabled' },
        messages: [{ role: 'system', content: system }, { role: 'user', content: user }] }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(`LLM error: ${d.error?.message || r.status}`);
    t = d.choices[0].message.content;
  } else t = await claude(system, user, key);
  if (!json) return t.replace(/^\s*```[\w-]*\s*$/gm, '').trim();
  const m = t.match(/[\[{][\s\S]*[\]}]/);
  if (!m) throw new Error('Model did not return JSON');
  return JSON.parse(m[0]);
}
async function claude(system, user, key) {
  const call = fb => fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true', ...(fb && { 'anthropic-beta': 'server-side-fallback-2026-07-01' }) },
    body: JSON.stringify({ model: MODEL(), max_tokens: 16000, system, output_config: { effort: 'low' },
      ...(fb && { fallbacks: 'default' }), messages: [{ role: 'user', content: user }] }),
  });
  let r = await call(true);
  if (r.status === 400) r = await call(false); // account/model without the fallback beta
  const d = await r.json();
  if (!r.ok) throw new Error(`LLM error: ${d.error?.message || r.status}`);
  if (d.stop_reason === 'refusal') throw new Error('The model declined this request.');
  return d.content.filter(c => c.type === 'text').map(c => c.text).join('');
}

// Prompt templates — Fig. 12–15 of the paper (transcribed), plus our own for refer/share/explain (not given in paper).
const T = {
  add: (p, refer) => `[ADD] As an AI Python code-writing assistant, your task is to generate specific Python code segments based on the user's input in [$PROMPT]. When a request for code continuation is made, refer to context from [$REFER]. In such cases, concatenate the prompt with the previously generated code from [$REFER] to form a cohesive extension.
Requirements:
- Accurately generate Python code that aligns with the directives in [$PROMPT].
- In case of code continuation, seamlessly integrate new code with the existing code from [$REFER].
- Focus on the latter parts of the prompt if it contains multiple instructions, but ensure that the entire prompt is considered.
- Provide concise responses, strictly limited to the required code without additional explanations, contextual information, or comments.

[$PROMPT]: ${p}
[$REFER]:
${refer}`,
  edit: (p, ctx, above) => `As an AI Python code editor, your role is to modify existing Python code based on user instructions in [$PROMPT]. Use the code provided in [$CONTEXT] as the base for your modifications. The user will specify the exact changes needed, which may include bug fixes, adding new functionalities, or altering existing ones.
Guidelines:
- Clearly understand and follow the modification instructions in [$PROMPT].
- Ensure that the edited code remains consistent with the overall logic and structure of the original code in [$CONTEXT].
- If the prompt includes multiple edit requests, prioritize them based on their order in the prompt.
- The response should be limited to the modified code only, without additional explanations or comments.
- Maintain the integrity of the original code, ensuring that changes do not introduce new errors or disrupt existing functionalities.

[$PROMPT]: ${p}
[$CONTEXT]:
${ctx}
(Code of the blocks above, already executed:)
${above}`,
  link: (pairs) => `You are an AI model specializing in analyzing Python code dependencies. Your task is to assess pairs of code segments provided by the user, identify procedural dependencies between them, and determine if any changes in one segment necessitate updates in the other.
Input: A list of pairs of code segments, each with a unique identifier (id) and index. Code_Segment_A has just been changed (previous_code is its code before the change; B was written against previous_code); Code_Segment_B is linked to it. Instructions:
- Analyze Dependencies: For each pair of code segments, identify the dependencies and the impact of changes in one segment on the other.
- Decide on Updates: Based on the dependency analysis, determine if updating one segment requires changes to the other. Use logical reasoning to justify your decision.
- Provide Updated Code: If an update is necessary, provide the updated code for the affected segment (Code_Segment_B).
- Linked phrase: each pair names the linked phrase in A's prompt and in B's prompt. The user linked them because they denote the same variable/value, possibly under different names. B must follow whatever A's linked phrase now refers to in A's code (e.g. if A now stores its result under a new variable name, B must use that new name). If B's phrase should change to stay consistent, give the new phrase.
Output Format: a JSON list of objects with
- id: [Unique identifier of the code pair]
- index: [index number of the code pair]
- updated: [Boolean indicating if an update is necessary]
- updated_code: [String containing the updated code, if applicable]
- updated_phrase: [new text for B's linked phrase, or null]
- reasoning: [one sentence]

Input:
${JSON.stringify(pairs, null, 2)}`,
  request: (reqs) => `You are an AI model tasked with evaluating whether the provided code fulfills specific user requests. Each request comes with a set of details including an ID, an index number, a prompt, the generated code, and supplementary information.
Input: A list of user requests, each containing:
- id: [string] - The ID of the request.
- index: [number] - The index of the request.
- prompt: [string] - The original prompt used for the code request.
- code: [string] - The generated code based on the prompt.
- supplementary_info: [string] - Additional information or specific requirements related to the request.
Task: Evaluate if the 'code' from each request successfully meets the criteria or needs expressed in the 'supplementary_info'. Please logically reason through each request, considering how the 'code' corresponds to the 'supplementary_info'.
Output Format: Return a list of objects, each including:
- id: [string] - The same ID as in the input.
- index: [number] - The same index as in the input.
- reasoning: [string] - one or two sentences relating the code to the supplementary_info, written before deciding
- fulfilled: [boolean] - indicates whether the code fulfills the supplementary info

Input:
${JSON.stringify(reqs, null, 2)}`,
  // not in the paper: how refer / share / fulfilled-request rebuild a prompt block
  regen: (mine, node, prov, msg, above) => `A collaborator's prompt block is given as context for the user's prompt block. Rewrite the user's block so it builds on the collaborator's work (use the variables, columns and results the collaborator's code produces instead of re-deriving them).
[$PROMPT] user's prompt: ${text(mine)}
[$NODE] phrase in the user's prompt that points at the collaborator's work: ${node ? `"${node.v}"` : '(whole prompt)'}
[$CODE] user's current code:
${mine.code || '(none yet)'}
[$REFER] collaborator ${prov.author}'s prompt: ${text(prov)}
collaborator's code:
${prov.code || '(none)'}
collaborator's execution result:
${(prov.out?.text || prov.out?.err || '(not run)').slice(0, 2000)}
${msg ? `[$MESSAGE] ${msg}\n` : ''}[$ABOVE] code of the blocks above the user's block:
${above}
Return JSON: {"node_text": "<new short text for [$NODE], e.g. the collaborator's variable name; or null>", "code": "<complete Python code for the user's block, no comments>"}`,
  explain: (b) => `Explain how this code implements its natural-language prompt, step by step, linking prompt phrases to code lines.
PROMPT: ${text(b)}
CODE (numbered):
${b.code.split('\n').map((l, i) => `${i + 1}: ${l}`).join('\n')}
Return JSON: {"steps": [{"phrase": "<exact substring of PROMPT, or a short label if implicit>", "lines": [<1-based line numbers>], "explanation": "<one short sentence>"}]}`,
};

// ---------- code changes and the four mechanisms ----------
async function commitCode(id, code, action, by = ME, visited = new Set()) {
  const b = S.blocks[id]; b.code = code;
  b.hist = [...(b.hist || []), snap(b, action, by)].slice(-30);
  put('blocks', b);
  await afterCodeChange(id, visited);
}
// D2: a code change may fulfil open requests and must propagate along links
async function afterCodeChange(id, visited) {
  if (visited.has(id)) return; visited.add(id);
  const anc = ancestors(id);
  for (const a of Object.values(S.actions)) {
    try {
      if (a.type === 'request' && a.status === 'open' && live(a) && (a.tgt.b === id || anc.includes(a.tgt.b))) await checkRequest(a.id, id, visited);
      if (a.type === 'link' && live(a) && (a.src.b === id || a.tgt.b === id)) await syncLink(a.id, id, visited);
    } catch (e) { toastErr(e.message); }
  }
}
async function checkRequest(aid, provId, visited) {
  const a = S.actions[aid], p = S.blocks[provId];
  busy(a.src.b, `checking request on “${text(p)}”…`);
  try {
    const [r] = [].concat(await llm(T.request([{ id: a.id, index: 1, prompt: text(p), code: p.code, supplementary_info: a.msg || text(S.blocks[a.src.b]) }]), true));
    if (!r?.fulfilled) return;
    await regen(a.src.b, a.src.n, provId, a, visited);
    const cur = S.actions[aid]; cur.status = 'fulfilled'; put('actions', cur);
    toast(`Request fulfilled by “${text(p)}” — “${text(S.blocks[a.src.b])}” regenerated.`);
  } finally { busy(a.src.b, null); }
}
async function syncLink(aid, changedId, visited) {
  const a = S.actions[aid];
  const [mine, other] = a.src.b === changedId ? [a.src, a.tgt] : [a.tgt, a.src];
  const A = S.blocks[mine.b], B = S.blocks[other.b];
  if (!B?.code?.trim()) return;
  busy(B.id, 'link: checking dependency…');
  try {
    const [r] = [].concat(await llm(T.link([{ id: a.id, index: 1,
      Code_Segment_A: { prompt: text(A), linked_phrase: label(mine), previous_code: A.hist?.at(-2)?.code ?? '', code: A.code },
      Code_Segment_B: { prompt: text(B), linked_phrase: label(other), code: B.code } }]), true));
    busy(B.id, null);
    if (!r?.updated || !r.updated_code) return;
    const nb = S.blocks[B.id], seg = other.n && nb.segs.find(s => s.id === other.n);
    if (seg && r.updated_phrase) seg.v = r.updated_phrase;
    await commitCode(B.id, r.updated_code, 'link', a.by, visited);
    toast(`Link: “${text(nb)}” updated automatically.`);
  } finally { busy(B.id, null); }
}
// refer / share / fulfilled request: rebuild consumer block using provider block as context
async function regen(consumerId, nodeId, providerId, a, visited = new Set()) {
  const c = S.blocks[consumerId], p = S.blocks[providerId];
  busy(consumerId, `${a.type}: regenerating prompt + code…`);
  try {
    const node = nodeId && c.segs.find(s => s.id === nodeId);
    const r = await llm(T.regen(c, node, p, a.msg, codeAbove(consumerId)), true);
    busy(consumerId, null);
    const nc = S.blocks[consumerId], nn = nodeId && nc.segs.find(s => s.id === nodeId);
    if (nn && r.node_text) nn.v = r.node_text;
    await commitCode(consumerId, r.code, a.type, a.by, visited);
  } finally { busy(consumerId, null); }
}
async function mech(type, tgtB, rowEl) {
  if (!SOURCE) return toast('Select a phrase in one of your prompts and choose Make node first.');
  if (SOURCE.b === tgtB) return toast('Pick a target in a different prompt.');
  const tb = S.blocks[tgtB];
  // target node: text selected in the wiki row → new node; else a clicked wiki node; else whole prompt/heading
  let n = null; const sel = getSelection();
  if (sel.rangeCount && !sel.isCollapsed && rowEl.contains(sel.anchorNode)) n = makeTargetNode(tgtB, sel);
  else if (TGTNODE?.b === tgtB) n = TGTNODE.n;
  let msg = '';

const panelOf = id => $('.panel', els[id]);
const closeBtn = id => h('button', { title: 'Close', 'aria-label': 'Close', onclick: () => { const p = panelOf(id); p.replaceChildren(); p.dataset.kind = ''; } }, icon('x'));
async function explain(id) {
  const pnl = panelOf(id), b = S.blocks[id];
  if (pnl.dataset.kind === 'explain') { pnl.replaceChildren(); pnl.dataset.kind = ''; return; }
  if (!b.code.trim()) return toast('Generate code first.');
  pnl.dataset.kind = 'explain'; pnl.replaceChildren(h('div', { class: 'busy', style: 'margin:0' }, icon('loader'), 'Explaining how the code implements the prompt…'));
  try {
    const steps = (await llm(T.explain(b), true)).steps || [], P = text(b);
    const marks = steps.map((s, i) => ({ at: s.phrase ? P.toLowerCase().indexOf(s.phrase.toLowerCase()) : -1, len: (s.phrase || '').length, i }))
      .filter(m => m.at >= 0).sort((x, y) => x.at - y.at);
    const pEl = h('div', { class: 'xprompt' }); let pos = 0;
    for (const m of marks) if (m.at >= pos) { pEl.append(P.slice(pos, m.at), h('mark', { style: `background:${COL[m.i % 6]}`, 'data-i': m.i }, P.slice(m.at, m.at + m.len))); pos = m.at + m.len; }
    pEl.append(P.slice(pos));
    const ls = {}; steps.forEach((s, i) => (s.lines || []).forEach(l => ls[l] ??= i));
    const cEl = h('pre', { class: 'xcode' }, b.code.split('\n').map((l, k) => h('div', ls[k + 1] != null ? { style: `background:${COL[ls[k + 1] % 6]}`, 'data-i': ls[k + 1] } : {}, `${String(k + 1).padStart(2)}  ${l}`)));
    const sEl = h('ol', { class: 'xsteps' }, steps.map((s, i) => h('li', { 'data-i': i }, h('mark', { style: `background:${COL[i % 6]}` }, s.phrase || '—'), ' ', s.explanation)));
    pnl.replaceChildren(h('div', { class: 'phdr' }, 'Explanation (hover to trace)', closeBtn(id)), pEl, cEl, sEl);
    pnl.onmouseover = e => { const i = e.target.closest('[data-i]')?.dataset.i; pnl.querySelectorAll('[data-i]').forEach(x => x.classList.toggle('dim', i != null && x.dataset.i !== i)); };
  } catch (e) { pnl.replaceChildren(h('div', { class: 'err' }, e.message)); }
}
function diff(a, b) { // LCS diff of two token arrays → [op, token]
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push(['=', a[i]]); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) out.push(['-', a[i++]]); else out.push(['+', b[j++]]); }
  while (i < n) out.push(['-', a[i++]]); while (j < m) out.push(['+', b[j++]]);
  return out;
}
console.assert(diff(['a', 'b', 'c'], ['a', 'x', 'c']).map(d => d[0]).join('') === '=-+=', 'diff self-check');
function history(id) {
  const pnl = panelOf(id);
  if (pnl.dataset.kind === 'history') { pnl.replaceChildren(); pnl.dataset.kind = ''; return; }
  pnl.dataset.kind = 'history';
  const b = S.blocks[id], vers = [...(b.hist || [])].reverse(), view = h('div');
  const show = (v, row) => {
    pnl.querySelectorAll('.hrow').forEach(r => r.classList.toggle('on', r === row));
    const cur = S.blocks[id], tok = s => s.split(/(\s+)/);
    const pd = diff(tok(v.segs.map(s => s.v).join('')), tok(text(cur)));
    const cd = diff(v.code.split('\n'), cur.code.split('\n'));
    view.replaceChildren(
      h('p', { class: 'hint' }, 'Selected version → current. Red was removed, green was added.'),
      h('div', { class: 'xprompt' }, pd.map(([o, t]) => o === '=' ? t : h('span', { class: o === '-' ? 'del' : 'ins' }, t))),
      h('pre', { class: 'dcode' }, cd.map(([o, t]) => h('div', { class: o === '-' ? 'del' : o === '+' ? 'ins' : '' }, `${o === '=' ? ' ' : o} ${t}`))),
      h('button', { onclick: async () => { const x = S.blocks[id]; x.segs = structuredClone(v.segs); x.editor = ME; pnl.replaceChildren(); pnl.dataset.kind = ''; await commitCode(id, v.code, 'restore'); } }, icon('reset'), 'Restore this version'));
  };
  pnl.replaceChildren(h('div', { class: 'phdr' }, `History (${vers.length})`, closeBtn(id)),
    ...vers.map(v => { const row = h('div', { class: 'hrow', onclick: () => show(v, row) }, h('span', { class: 'muted' }, new Date(v.ts).toLocaleTimeString()), av(v.by), h('b', {}, v.action), h('span', { class: 'muted' }, v.segs.map(s => s.v).join('').slice(0, 60))); return row; }),
    view);
}

// ---------- modals, settings, wiring ----------
function modal(nodes, okText = 'OK', cancelText = 'Cancel') {
  return new Promise(res => {
    modalOpen = true; const box = $('#modal');
    let closed = false;
    const done = v => { if (closed) return; closed = true; box.hidden = true; box.replaceChildren(); modalOpen = false; res(v); setTimeout(checkShares, 50); };
    box.replaceChildren(h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true', onkeydown: e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); } }, ...nodes,
      h('div', { class: 'btns' }, h('button', { onclick: () => done(false) }, cancelText), h('button', { class: 'primary', onclick: () => done(true) }, okText))));
    box.hidden = false; (box.querySelector('input') || box.querySelector('.primary')).focus();
  });
}
// body: string or string[] (paragraphs); returns true / the typed text on confirm, null on cancel
async function ask(body, { title, input = false, value, placeholder = '', ok = 'OK', cancel = 'Cancel' } = {}) {
  const inp = input && h('input', { placeholder, value, 'aria-label': placeholder || title });
  const res = await modal([title && h('h3', {}, title), ...[].concat(body).map(t => h('p', {}, t)), inp], ok, cancel);
  return res ? (input ? inp.value : true) : null;
}
async function openSettings() {
  const k = h('input', { type: 'password', placeholder: 'sk-…', value: localStorage.getItem('cp_key') || '' });
  const m = h('input', { value: MODEL() });
  if (await modal([h('h3', {}, 'Settings'), h('label', {}, 'API key (DeepSeek, or Anthropic for claude-* models)', k),
    h('label', {}, 'Model (deepseek-flash, deepseek-v4-pro, or e.g. claude-opus-5-5)', m),
    h('p', { class: 'muted' }, 'Stored in this browser’s localStorage (shared by all CoPrompt windows); requests go straight to the provider’s API.')], 'Save')) {
    localStorage.setItem('cp_key', k.value.trim()); localStorage.setItem('cp_model', m.value.trim() || 'deepseek-flash');
    keyState();
  }
}
function render() { renderEditor(); renderWiki(); renderMsgs(); decorateChips(); checkShares(); }

// floating "Make node" button for a text selection inside one of the editor prompts
document.addEventListener('selectionchange', () => {
  const s = getSelection(), mk = $('#mk');
  const r = s.rangeCount && !s.isCollapsed && s.getRangeAt(0);
  const ok = r && r.startContainer === r.endContainer && r.startContainer.nodeType === 3 && r.startContainer.parentElement.closest('#editor .prompt');
  mk.hidden = !ok; if (!ok) return;
  const rc = r.getBoundingClientRect(); mk.style.left = rc.left + scrollX + 'px'; mk.style.top = rc.top + scrollY - 40 + 'px';
});
$('#mk').addEventListener('mousedown', e => {
  e.preventDefault();
  const s = getSelection(), r = s.getRangeAt(0), p = r.startContainer.parentElement.closest('.prompt'), id = p.closest('.block').dataset.id;
  const [a, z] = trimWs(r.startContainer.data, r.startOffset, r.endOffset); // Windows double-click grabs the trailing space
  if (a === z) return;
  r.setStart(r.startContainer, a); r.setEnd(r.startContainer, z);
  const nid = uid(); const c = chip({ id: nid, v: r.toString() });
  r.deleteContents(); r.insertNode(c); s.removeAllRanges(); $('#mk').hidden = true;
  commitPrompt(id); SOURCE = { b: id, n: nid }; render();
  toast('Source node set. Now pick a target prompt in the Prompt Wiki →');
});
$('#addbar').addEventListener('click', e => { const k = e.target.closest('[data-k]')?.dataset.k; if (k) addBlock(k, ordered().at(-1)?.id); });
$('#settings').onclick = openSettings;
$('#reset').onclick = async () => { if (await ask('Clears the shared notebook in every open window and restores the Titanic scenario. This cannot be undone.', { title: 'Reset the demo?', ok: 'Reset notebook' })) { const n = seed(); hardReset(n); bc.postMessage({ kind: 'reset', S: n }); } };
$('#me').replaceChildren(av(ME), `You are ${ME}`);
const OTHER = ME === 'Alice' ? 'Bob' : 'Alice';
$('#other').textContent = `Open as ${OTHER}`;
document.querySelectorAll('[data-icon]').forEach(e => e.prepend(icon(e.dataset.icon)));
// legend for the mechanism colours used across the UI, plus the one-line recipe
$('#legend').replaceChildren(
  h('div', { class: 'legend' }, Object.keys(MECH).map(t => h('span', { class: 'lg', style: `--c:${MECH[t].c}`, title: MECH[t].tip }, mechTag(t)))),
  h('p', { class: 'howto' }, 'Select a phrase in your prompt, choose ', h('b', {}, 'Make node'), ', then pick a mechanism on a target below.'));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SOURCE && !modalOpen) { SOURCE = TGTNODE = null; render(); } });
function keyState() { // make a missing API key visible before anything fails
  const has = !!localStorage.getItem('cp_key'), b = $('#settings');
  b.classList.toggle('needs', !has); b.lastChild.textContent = has ? 'API key' : 'Add API key';
}
window.addEventListener('storage', e => { if (e.key === 'cp_key') keyState(); });
keyState();
document.title = `CoPrompt · ${ME}`;
$('#other').onclick = () => window.open(`?user=${OTHER}`, OTHER, 'width=1100,height=900');
window.addEventListener('beforeunload', () => presence(null));
render();
</script>
